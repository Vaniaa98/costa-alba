<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSTA ALBA — an open-world crime story</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a24; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; }
  #wanted { font-size: 34px; letter-spacing: 6px; color: #ffd23b; text-shadow: 0 0 12px rgba(255,210,59,0.6), 0 2px 6px #000; display: none; }
  #wanted .dim { color: rgba(255,255,255,0.25); }
  #clock { font-size: 15px; font-weight: 600; text-shadow: 0 1px 4px #000; margin-top: 2px; }
  #money { font-size: 28px; font-weight: 800; color: #7dff8a; text-shadow: 0 2px 6px #000; margin-top: 2px; }
  #hud-district { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); text-align: center; display: none; }
  #district-name { font-size: 30px; font-weight: 800; font-style: italic; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.9); letter-spacing: 1px; }
  #district-tag { font-size: 13px; font-weight: 700; letter-spacing: 4px; color: #7dffd4; text-shadow: 0 1px 6px #000; }
  #hud-objective { position: absolute; top: 14px; right: 16px; width: 300px; background: rgba(10,20,30,0.72); border-left: 4px solid #ffd23b; padding: 10px 12px; border-radius: 4px; }
  #obj-title { font-size: 15px; font-weight: 800; color: #ffd23b; }
  #obj-text { font-size: 14px; margin-top: 3px; line-height: 1.35; }
  #radio { font-size: 12px; color: #ffd9a0; margin-top: 7px; border-top: 1px solid rgba(255,255,255,0.25); padding-top: 6px; }
  #hud-bottom-left { position: absolute; left: 16px; bottom: 16px; }
  #health { width: 220px; height: 18px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.5); border-radius: 3px; position: relative; overflow: hidden; }
  #health-fill { height: 100%; background: linear-gradient(90deg, #27a35c, #7dff8a); width: 100%; }
  #health-num { position: absolute; inset: 0; text-align: center; font-size: 12px; font-weight: 700; line-height: 18px; text-shadow: 0 1px 3px #000; }
  #weapon { font-size: 16px; font-weight: 800; color: #ffd23b; margin-top: 6px; text-shadow: 0 1px 4px #000; letter-spacing: 1px; }
  #speed { position: absolute; right: 18px; bottom: 218px; text-align: right; text-shadow: 0 2px 8px #000; }
  #speed-num { font-size: 44px; font-weight: 800; color: #fff; }
  #speed-unit { font-size: 14px; font-weight: 700; color: #dfeef5; }
  #speed-car { font-size: 14px; font-weight: 700; color: #7dff8a; margin-top: -2px; }
  #dialogue { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); max-width: 760px; text-align: center; font-size: 18px; font-style: italic; color: #fff; text-shadow: 0 2px 8px #000; display: none; }
  #minimap { position: absolute; right: 16px; bottom: 16px; border: 2px solid rgba(255,255,255,0.7); border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
  #toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(10,20,30,0.85); border: 1px solid #ffd23b; padding: 10px 18px; border-radius: 6px; font-size: 16px; font-weight: 700; opacity: 0; transition: opacity 0.25s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  .menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(20,10,30,0.35), rgba(20,10,30,0.72)); pointer-events: auto; text-align: center; padding: 20px; }
  .menu.hidden { display: none; }
  .menu h1 { font-size: 64px; letter-spacing: 10px; margin: 0; color: #ffd23b; text-shadow: 0 4px 24px rgba(0,0,0,0.8); }
  .menu .tag { font-size: 18px; color: #dfeef5; margin: 8px 0 18px; }
  .menu p { max-width: 560px; font-size: 16px; line-height: 1.5; color: #eaf4f8; }
  .menu button { pointer-events: auto; cursor: pointer; background: #ffd23b; color: #14202c; border: none; font-size: 18px; font-weight: 800; letter-spacing: 2px; padding: 12px 34px; margin: 6px; border-radius: 4px; }
  .menu button:hover { background: #ffe14d; }
  .menu .controls { font-size: 13px; color: #b9d2de; margin-top: 22px; }
  .menu .foot { font-size: 12px; color: #8fa8b5; margin-top: 8px; }
  #menu-progress { font-size: 15px; color: #ffd23b; margin-bottom: 10px; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="game" aria-label="Costa Alba game view"></div>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
